<script>
        document.querySelectorAll('.star-rating').forEach(ratingContainer => {
            const stars = ratingContainer.querySelectorAll('.material-symbols-outlined');
            
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const value = parseInt(star.getAttribute('data-value'));
                    
                    // Reset all stars in this container
                    stars.forEach(s => {
                        s.classList.remove('filled');
                        // Reset fill font variation
                        s.style.fontVariationSettings = "'FILL' 0";
                    });
                    
                    // Fill clicked star and all previous siblings (which are lower values due to flex-row-reverse)
                    // Actually, because of flex-row-reverse, the visual left is DOM right.
                    // We just need to fill all stars with data-value <= clicked value
                    stars.forEach(s => {
                        if (parseInt(s.getAttribute('data-value')) <= value) {
                            s.classList.add('filled');
                            s.style.fontVariationSettings = "'FILL' 1";
                        }
                    });
                });
            });
        });
    </script>
