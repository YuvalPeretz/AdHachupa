<style>
        body {
            font-family: 'Rubik', sans-serif;
            /* Using a subtle pattern for the elegant background texture */

<body class="bg-surface text-on-surface min-h-screen flex flex-col relative pb-32">
<!-- Top Progress Indicator -->
<div class="w-full pt-8 px-gutter">
<div class="flex justify-between items-center mb-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined rtl:rotate-180">arrow_back</span>
</button>
<span class="font-label-sm text-label-sm text-on-surface-variant">שלב 1 מתוך 6</span>
<div class="w-10 h-10"></div> <!-- Spacer for balance -->
</div>
<div class="flex gap-1 w-full h-1.5 rounded-full overflow-hidden">
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 px-gutter pt-8 pb-12 flex flex-col max-w-container-max mx-auto w-full">
<!-- Headers -->
<header class="mb-10 text-center md:text-right">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">
                אילו אירועים אתם מתכננים?
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                ניתן לבחור יותר מאחד
            </p>
</header>
<!-- Event Selection Grid -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
<!-- Card 1: Selected (חתונה) -->
<button class="relative flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border-2 border-primary-container transition-all text-center aspect-square md:aspect-auto md:h-40 group hover:shadow-md">
<!-- Checkmark -->
<div class="absolute top-3 right-3 text-tertiary-fixed-dim">
<span class="material-symbols-outlined icon-fill">check_circle</span>
</div>
<div class="w-16 h-16 rounded-full bg-primary-container/30 flex items-center justify-center mb-3 text-primary">
<span class="material-symbols-outlined text-3xl">celebration</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-bold">חתונה</span>
</button>
<!-- Card 2: Unselected (חינה) -->
<button class="relative flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border-2 border-transparent transition-all text-center aspect-square md:aspect-auto md:h-40 group hover:border-outline-variant hover:shadow-md">
<div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center mb-3 text-on-surface-variant group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-3xl">spa</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">חינה</span>
</button>
<!-- Card 3: Unselected (מסיבת רווקים/ות) -->
<button class="relative flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border-2 border-transparent transition-all text-center aspect-square md:aspect-auto md:h-40 group hover:border-outline-variant hover:shadow-md">
<div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center mb-3 text-on-surface-variant group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-3xl">local_bar</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">מסיבת רווקים/ות</span>
</button>
<!-- Card 4: Unselected (שבת חתן) -->
<button class="relative flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border-2 border-transparent transition-all text-center aspect-square md:aspect-auto md:h-40 group hover:border-outline-variant hover:shadow-md">
<div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center mb-3 text-on-surface-variant group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-3xl">menu_book</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">שבת חתן</span>
</button>
<!-- Card 5: Unselected (מקווה/הפרשת חלה) -->
<button class="relative flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border-2 border-transparent transition-all text-center aspect-square md:aspect-auto md:h-40 group hover:border-outline-variant hover:shadow-md">
<div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center mb-3 text-on-surface-variant group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-3xl">bakery_dining</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">מקווה/הפרשת חלה</span>
</button>
<!-- Card 6: Unselected (קבלת פנים) -->
<button class="relative flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border-2 border-transparent transition-all text-center aspect-square md:aspect-auto md:h-40 group hover:border-outline-variant hover:shadow-md">
<div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center mb-3 text-on-surface-variant group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-3xl">groups</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">קבלת פנים</span>
</button>

<span class="border-b border-transparent group-hover:border-primary transition-colors">הוסף אירוע אחר</span>
</button>
</div>

<div class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-surface via-surface to-transparent pt-12 pb-8 px-gutter z-10 flex justify-center">
<div class="max-w-container-max w-full">
<button class="w-full md:w-auto md:min-w-[200px] bg-primary-container text-on-primary-container font-label-md text-label-md py-4 px-8 rounded-full shadow-lg hover:bg-inverse-primary hover:shadow-xl transition-all active:scale-95 flex items-center justify-center gap-2 float-left">

</button>
