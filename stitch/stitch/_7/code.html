<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Progress Indicator Header -->
<header class="w-full px-gutter pt-12 pb-4 z-10 bg-surface">
<div class="flex items-center justify-between mb-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-widest">שלב 4 מתוך 6</span>
<button aria-label="חזור" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Progress Bar -->
<div class="w-full h-[3px] bg-surface-variant rounded-full overflow-hidden" dir="ltr">
<div class="h-full bg-primary rounded-full transition-all duration-700 ease-in-out w-[66.6%]" style="box-shadow: 0 0 10px rgba(120, 85, 93, 0.3);"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-gutter pt-lg pb-32 flex flex-col">
<!-- Typography Header -->
<div class="mb-xl animate-fade-in">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">מה הטווח התקציבי הכולל שלכם?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">כולל כל האירועים</p>
</div>
<!-- Interactive Selection Options -->
<div aria-labelledby="budget-selection" class="flex flex-col gap-sm animate-fade-in delay-100" role="radiogroup">
<!-- Option 1: Unselected -->
<button aria-checked="false" class="group relative w-full text-right p-md rounded-xl bg-surface border border-outline-variant hover:border-primary-fixed-dim transition-all duration-300 shadow-[0_4px_20px_rgba(45,45,45,0.03)] hover:shadow-[0_8px_24px_rgba(45,45,45,0.06)] overflow-hidden" role="radio">
<div class="relative z-10 flex items-center justify-between">
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">עד ₪50,000</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant group-hover:border-primary-fixed-dim transition-colors flex items-center justify-center"></div>
</div>
</button>
<!-- Option 2: Selected (Blush Rose fill + Gold border per instructions mapped to theme tokens) -->
<button aria-checked="true" class="group relative w-full text-right p-md rounded-xl bg-primary-container border-2 border-tertiary-fixed-dim transition-all duration-300 shadow-[0_8px_24px_rgba(242,196,206,0.2)] overflow-hidden" role="radio">
<!-- Subtle gradient overlay for depth -->
<div class="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent pointer-events-none"></div>
<div class="relative z-10 flex items-center justify-between">
<span class="font-body-lg text-body-lg text-on-primary-container font-bold">₪50,000 – ₪100,000</span>
<!-- Selected Icon indicator -->
<div class="w-5 h-5 rounded-full border-2 border-tertiary-fixed-dim bg-surface flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-tertiary-fixed-dim"></div>
</div>
</div>
</button>
<!-- Option 3: Unselected -->
<button aria-checked="false" class="group relative w-full text-right p-md rounded-xl bg-surface border border-outline-variant hover:border-primary-fixed-dim transition-all duration-300 shadow-[0_4px_20px_rgba(45,45,45,0.03)] hover:shadow-[0_8px_24px_rgba(45,45,45,0.06)] overflow-hidden" role="radio">
<div class="relative z-10 flex items-center justify-between">
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">₪100,000 – ₪200,000</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant group-hover:border-primary-fixed-dim transition-colors flex items-center justify-center"></div>
</div>
</button>

<button aria-checked="false" class="group relative w-full text-right p-md rounded-xl bg-surface border border-outline-variant hover:border-primary-fixed-dim transition-all duration-300 shadow-[0_4px_20px_rgba(45,45,45,0.03)] hover:shadow-[0_8px_24px_rgba(45,45,45,0.06)] overflow-hidden" role="radio">
<div class="relative z-10 flex items-center justify-between">
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">מעל ₪200,000</span>

</button>

<!-- Interactive script to handle purely visual radio selection logic without form submission -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('[role="radio"]');
            
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    // Reset all buttons
                    buttons.forEach(btn => {
                        btn.setAttribute('aria-checked', 'false');
                        btn.className = "group relative w-full text-right p-md rounded-xl bg-surface border border-outline-variant hover:border-primary-fixed-dim transition-all duration-300 shadow-[0_4px_20px_rgba(45,45,45,0.03)] hover:shadow-[0_8px_24px_rgba(45,45,45,0.06)] overflow-hidden";
                        
                        // Reset inner HTML structure for unselected state
                        const textElement = btn.querySelector('span');
                        const textValue = textElement.textContent;
                        btn.innerHTML = `
                            <div class="relative z-10 flex items-center justify-between">
                                <span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">${textValue}</span>
                                <div class="w-5 h-5 rounded-full border-2 border-outline-variant group-hover:border-primary-fixed-dim transition-colors flex items-center justify-center"></div>
                            </div>
                        `;
                    });

                    // Set clicked button to selected state
                    button.setAttribute('aria-checked', 'true');
                    button.className = "group relative w-full text-right p-md rounded-xl bg-primary-container border-2 border-tertiary-fixed-dim transition-all duration-300 shadow-[0_8px_24px_rgba(242,196,206,0.2)] overflow-hidden";
                    
                    const textValue = button.querySelector('span').textContent;
                    button.innerHTML = `
                        <div class="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent pointer-events-none"></div>
                        <div class="relative z-10 flex items-center justify-between">
                            <span class="font-body-lg text-body-lg text-on-primary-container font-bold">${textValue}</span>
                            <div class="w-5 h-5 rounded-full border-2 border-tertiary-fixed-dim bg-surface flex items-center justify-center">
                                <div class="w-2.5 h-2.5 rounded-full bg-tertiary-fixed-dim"></div>
                            </div>
                        </div>
                    `;
                });
            });
        });
    </script>
