<body class="bg-background text-on-background min-h-screen flex flex-col antialiased font-body-md overflow-x-hidden">
<main class="flex-1 w-full max-w-container-max mx-auto px-gutter py-lg flex flex-col relative z-10 h-screen">
<!-- Progress Indicator (Step 5 of 6) -->
<div class="flex items-center justify-center gap-2 mb-xl mt-8">
<div class="h-1.5 w-8 rounded-full bg-surface-variant"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-variant"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-variant"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-variant"></div>
<div class="h-1.5 w-12 rounded-full bg-tertiary-container shadow-sm"></div>

<!-- Header -->
<div class="text-center mb-12">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">ספרו לנו עליכם</h1>
</div>
<!-- Content Canvas -->
<form class="w-full max-w-md mx-auto flex-1 flex flex-col space-y-8">
<!-- Names & Genders Grid -->
<div class="grid grid-cols-2 gap-4">
<!-- Partner 1 -->
<div class="flex flex-col gap-3">
<div class="relative bg-surface rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border border-outline-variant focus-within:border-tertiary focus-within:ring-1 focus-within:ring-tertiary transition-all">
<input class="floating-input block w-full bg-transparent border-0 px-4 pt-6 pb-2 text-on-surface focus:ring-0 peer font-body-md rounded-xl" id="partner1" placeholder=" " type="text"/>
<label class="floating-label absolute right-4 top-4 text-outline origin-top-right transition-all duration-200 font-body-md pointer-events-none" for="partner1">שם בן/בת הזוג 1</label>
</div>
<div class="flex gap-2 justify-center bg-surface p-2 rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border border-surface-variant">
<button class="w-10 h-10 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center hover:bg-tertiary-container hover:text-on-tertiary-container transition-colors focus:outline-none focus:ring-2 focus:ring-tertiary group" type="button">
<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">male</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center hover:bg-tertiary-container hover:text-on-tertiary-container transition-colors focus:outline-none focus:ring-2 focus:ring-tertiary group" type="button">
<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">female</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center hover:bg-tertiary-container hover:text-on-tertiary-container transition-colors focus:outline-none focus:ring-2 focus:ring-tertiary group" type="button">
<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">more_horiz</span>
</button>
</div>
</div>
<!-- Partner 2 -->
<div class="flex flex-col gap-3">
<div class="relative bg-surface rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border border-outline-variant focus-within:border-tertiary focus-within:ring-1 focus-within:ring-tertiary transition-all">
<input class="floating-input block w-full bg-transparent border-0 px-4 pt-6 pb-2 text-on-surface focus:ring-0 peer font-body-md rounded-xl" id="partner2" placeholder=" " type="text"/>
<label class="floating-label absolute right-4 top-4 text-outline origin-top-right transition-all duration-200 font-body-md pointer-events-none" for="partner2">שם בן/בת הזוג 2</label>
</div>
<div class="flex gap-2 justify-center bg-surface p-2 rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border border-surface-variant">
<button class="w-10 h-10 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center hover:bg-tertiary-container hover:text-on-tertiary-container transition-colors focus:outline-none focus:ring-2 focus:ring-tertiary group" type="button">

</button>
<button class="w-10 h-10 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center hover:bg-tertiary-container hover:text-on-tertiary-container transition-colors focus:outline-none focus:ring-2 focus:ring-tertiary group" type="button">

<button class="w-10 h-10 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center hover:bg-tertiary-container hover:text-on-tertiary-container transition-colors focus:outline-none focus:ring-2 focus:ring-tertiary group" type="button">
<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">more_horiz</span>
</button>
</div>
</div>
</div>
<!-- Region Selector -->
<div class="relative bg-surface rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border border-outline-variant focus-within:border-tertiary focus-within:ring-1 focus-within:ring-tertiary transition-all">
<select class="block w-full bg-transparent border-0 px-4 py-4 text-on-surface focus:ring-0 appearance-none font-body-md z-10 relative cursor-pointer outline-none rounded-xl" id="region" required="">
<option class="text-outline" disabled="" hidden="" selected="" value="">באיזה אזור מתוכנן האירוע?</option>
<option class="text-on-surface" value="center">מרכז</option>
<option class="text-on-surface" value="north">צפון</option>
<option class="text-on-surface" value="south">דרום</option>
<option class="text-on-surface" value="jerusalem">ירושלים והסביבה</option>
</select>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none z-0">expand_more</span>
</div>

<div class="flex items-center justify-between bg-surface p-4 rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.05)] border border-surface-variant">
<span class="font-body-lg text-body-lg text-on-surface">האם האירוע כשר?</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<!-- Track -->
<div class="w-14 h-7 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:-translate-x-[1.75rem] after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-surface after:border-outline-variant after:border after:rounded-full after:h-6 after:w-6 after:transition-all after:shadow-sm peer-checked:bg-surface-dim peer-checked:after:bg-tertiary peer-checked:after:border-tertiary"></div>
</label>
</div>
<!-- Spacer -->
<div class="flex-1"></div>
<!-- Action Button -->
<div class="pb-8">
<button class="w-full bg-tertiary-container text-on-tertiary-container font-label-md text-label-md py-4 rounded-full flex items-center justify-center gap-2 hover:bg-tertiary hover:text-on-tertiary transition-all duration-300 shadow-md active:scale-[0.98]" type="button">
                    סיום

</button>
</div>
</form>

<!-- Script for subtle interactive states if needed -->
<script>
        // Simple script to handle floating label active state if initial value is present
        document.querySelectorAll('.floating-input').forEach(input => {
            input.addEventListener('input', function() {
                if(this.value.trim() !== "") {
                    this.classList.add('has-value');
                } else {
                    this.classList.remove('has-value');
                }
            });
        });
    </script>
